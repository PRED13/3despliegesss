<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control: Búsquedas de IA</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .grid-inputs { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #2196F3; }
        .card.ucs { border-top-color: #FFC107; }
        input { width: 90%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; }
        .btn-green { background: #28a745; color: white; width: 100%; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .results-container { display: flex; gap: 20px; margin-top: 20px; }
        .res-card { background: white; padding: 20px; flex: 1; border-radius: 8px; min-height: 200px; }
        ul { list-style: none; padding: 0; }
        li::before { content: "• "; color: #2196F3; }
        .costo-badge { background: #e3f2fd; padding: 10px; color: #1976d2; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Panel de Control: Búsquedas de IA</h1>
    
    <div class="grid-inputs">
        <div class="card">
            <h3>1. Puzzle Lineal (DFS)</h3>
            <label>Inicio: <input type="text" id="in_dfs" value="4,2,3,1"></label>
            <label>Objetivo: <input type="text" id="target_dfs" value="1,2,3,4"></label>
        </div>
        <div class="card">
            <h3>2. Vuelos (BFS)</h3>
            <label>Origen: <input type="text" id="in_bfs" value="jiloyork"></label>
            <label>Destino: <input type="text" id="target_bfs" value="sonora"></label>
        </div>
        <div class="card ucs">
            <h3>3. Carretera (UCS)</h3>
            <label>Origen: <input type="text" id="in_ucs" value="jiloyork"></label>
            <label>Destino: <input type="text" id="target_ucs" value="ags"></label>
        </div>
    </div>

    <button class="btn-green" onclick="calcularTodo()">Calcular Todas las Rutas</button>

    <div class="results-container">
        <div class="res-card">
            <h4>Resultado DFS</h4>
            <ul id="res_dfs"></ul>
        </div>
        <div class="res-card">
            <h4>Resultado BFS</h4>
            <ul id="res_bfs"></ul>
        </div>
        <div class="res-card">
            <h4>Resultado UCS</h4>
            <ul id="res_ucs"></ul>
            <div id="costo_ucs" class="costo-badge" style="display:none"></div>
        </div>
    </div>

    <script>
        async function calcularTodo() {
            const body = {
                inicio_dfs: document.getElementById('in_dfs').value.split(',').map(Number),
                meta_dfs: document.getElementById('target_dfs').value.split(',').map(Number),
                inicio_bfs: document.getElementById('in_bfs').value,
                meta_bfs: document.getElementById('target_bfs').value,
                inicio_ucs: document.getElementById('in_ucs').value,
                meta_ucs: document.getElementById('target_ucs').value
            };

            const response = await fetch('http://127.0.0.1:8000/api/resolver/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            // Dentro de la función calcularTodo()
            const payload = {
                inicio_dfs: document.getElementById('in_dfs').value.split(',').map(Number),
                meta_dfs: document.getElementById('target_dfs').value.split(',').map(Number),
                inicio_bfs: document.getElementById('in_bfs').value.trim().toLowerCase(), // Limpiar espacios y a minúsculas
                meta_bfs: document.getElementById('target_bfs').value.trim().toLowerCase(),
                inicio_ucs: document.getElementById('in_ucs').value.trim().toLowerCase(),
                meta_ucs: document.getElementById('target_ucs').value.trim().toLowerCase()
            };

            const data = await response.json();

            // Renderizar resultados
            renderList('res_dfs', data.dfs);
            renderList('res_bfs', data.bfs);
            renderList('res_ucs', data.ucs.camino);
            
            const costDiv = document.getElementById('costo_ucs');
            costDiv.style.display = 'block';
            costDiv.innerText = `Costo Total: ${data.ucs.costo}`;
        }

        function renderList(id, arr) {
            const el = document.getElementById(id);
            el.innerHTML = arr.map(item => `<li>${JSON.stringify(item)}</li>`).join('');
        }
    </script>
</body>
</html>
